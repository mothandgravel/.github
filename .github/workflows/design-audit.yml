name: Landing design audit

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/audit_visual.mjs"
      - "scripts/audit_loose_end.mjs"
      - "scripts/audit_moth.mjs"
      - "scripts/audit_handling.mjs"
      - "scripts/audit_moth_volume.mjs"
      - "scripts/audit_rooms.mjs"
      - "scripts/audit_wayfinding.mjs"
      - "scripts/audit_connection.mjs"
      - "scripts/audit_mapping.mjs"
      - "scripts/audit_coastal_replay.mjs"
      - "scripts/audit_coastal_transport.mjs"
      - "scripts/audit_coastal_guide.mjs"
      - "scripts/audit_shadow_inquiry.mjs"
      - "scripts/audit_coastal_identity.mjs"
      - "scripts/audit_coastal_haxr.mjs"
      - "scripts/audit_thread.mjs"
      - "scripts/audit_reading.mjs"
      - "scripts/audit_maritime.mjs"
      - "scripts/audit_maintenance.mjs"
      - "scripts/audit_playground.mjs"
      - "scripts/reading_output.test.py"
      - ".github/workflows/design-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned browser audit dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.1 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - name: Launch local static site
        run: |
          python3 -m http.server 8793 --bind 127.0.0.1 --directory docs >/tmp/mg-site.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8793/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mg-site.log
          exit 1
      - name: Capture desktop and mobile review / assert interaction health
        run: |
          failed=0
          for audit in wayfinding maintenance reading visual loose_end moth handling moth_volume rooms connection mapping coastal_replay coastal_transport shadow_inquiry coastal_identity coastal_haxr thread studio_note maritime playground; do
            echo "::group::$audit"
            node "scripts/audit_$audit.mjs" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Upload screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: landing-design-review
          path: artifacts/design-review/
          if-no-files-found: ignore
          retention-days: 14
