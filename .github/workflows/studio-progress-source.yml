name: Capture Studio progress test source
on:
  push:
    branches: [studio/durable-note-preparation]
    paths: [.github/workflows/studio-progress-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source at the exact feature commit
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/studio-progress-sha.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/studio-progress-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-progress-source
          path: |
            ${{ runner.temp }}/studio-progress-source.tar.gz
            ${{ runner.temp }}/studio-progress-sha.txt
          retention-days: 2
