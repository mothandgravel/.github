name: Validate Field Notes audio

on:
  push:
    paths:
      - "field_notes_audio/**"
      - "tests/**"
      - "tools/check_audio.py"
      - "pyproject.toml"
      - "uv.lock"
      - "audio/**"
      - "docs/notes/**"
      - "docs/assets/notes.json"
      - "scripts/field_audio.py"
      - "scripts/build_audio.py"
      - "docs/assets/audio/**"
      - "docs/assets/field-*"
      - "docs/assets/podcast-cover.*"
      - "scripts/audit_audio.mjs"
      - "scripts/field_listen_model.test.mjs"
      - ".github/workflows/audio-pilot.yml"
  pull_request:
    paths:
      - "field_notes_audio/**"
      - "tests/**"
      - "tools/check_audio.py"
      - "pyproject.toml"
      - "uv.lock"
      - "audio/**"
      - "docs/notes/**"
      - "docs/assets/notes.json"
      - "scripts/field_audio.py"
      - "scripts/build_audio.py"
      - "docs/assets/audio/**"
      - "docs/assets/field-*"
      - "docs/assets/podcast-cover.*"
      - "scripts/audit_audio.mjs"
      - "scripts/field_listen_model.test.mjs"
      - ".github/workflows/audio-pilot.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install audio encoding and inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install the pinned Python quality tool
        run: python3 -m pip install ruff==0.12.12
      - name: Verify Python idioms, source preservation, recovery and media offline
        run: python3 tools/check_audio.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install audio fixture and inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install pinned browser audit tools
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.1 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - name: Build a complete site with synthetic clips, without Cloud credentials
        run: python3 -m tests.audio.test_release --browser-fixture artifacts/audio-site-qa/docs
      - name: Verify listening, subtitles, queue and accessibility across both themes
        run: node scripts/audit_audio.mjs
      - name: Preserve listening interface checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listening-interface-review
          path: |
            artifacts/audio-site-qa/browser.json
            artifacts/audio-site-qa/*.png
          retention-days: 14

