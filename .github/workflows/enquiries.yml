name: Private enquiry contract
on:
  pull_request:
    paths: ["services/enquiries/**", ".github/workflows/enquiries.yml"]
  push:
    paths: ["services/enquiries/**", ".github/workflows/enquiries.yml"]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: services/enquiries/package-lock.json
      - run: npm ci --ignore-scripts --prefix services/enquiries
      - run: npm test --prefix services/enquiries
      - name: Build and smoke-test the disabled container
        run: |
          docker build -t mg-enquiries-test services/enquiries
          docker run --detach --name mg-enquiries-test -p 127.0.0.1:8787:8787 mg-enquiries-test
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/config > /tmp/mg-enquiry-config.json; then
              ready=true
              break
            fi
            sleep 1
          done
          docker logs mg-enquiries-test
          if [ "$ready" != true ]; then exit 1; fi
          node -e 'const c=JSON.parse(require("fs").readFileSync("/tmp/mg-enquiry-config.json"));if(c.accepting!==false)process.exit(1)'
          docker stop mg-enquiries-test
      - name: Remove smoke-test container
        if: always()
        run: docker rm --force mg-enquiries-test || true
