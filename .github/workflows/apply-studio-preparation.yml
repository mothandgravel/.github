name: Apply tested Studio preparation patch

on:
  push:
    branches:
      - studio/durable-note-preparation
    paths:
      - .github/workflows/apply-studio-preparation.yml
      - .github/studio-preparation.part*.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'mothandgravel/.github' && github.ref == 'refs/heads/studio/durable-note-preparation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify baseline and exact reviewed patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 5538c2ca427db8b46aba5fb54d5fbfacd7822dba
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          from pathlib import Path

          encoded = ''.join(
              Path(f'.github/studio-preparation.part{index:02d}.b64').read_text().strip()
              for index in range(1, 5)
          )
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          expected = '304265070ca0f42de142c940d08941504bf45ebf541c49bfca93343070728693'
          if len(patch) != 124758 or hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch transport identity mismatch; nothing applied')
          Path('/tmp/studio-preparation.patch').write_bytes(patch)
          PY
          git apply --check /tmp/studio-preparation.patch
          git apply --index --whitespace=error /tmp/studio-preparation.patch
      - name: Verify exact source quality without service requests
        run: |
          python -m pip install ruff==0.12.12
          python -m ruff check
          python -m ruff format --check
          git diff --cached --check
          git diff --quiet
      - name: Commit only to this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add durable authorized preparation and verified private recording adoption'
          git push origin HEAD:refs/heads/studio/durable-note-preparation
