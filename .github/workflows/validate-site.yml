name: Validate static site

on:
  push:
    paths:
      - "docs/**"
      - "scripts/**"
      - "tools/graphics/**"
      - "tools/specimens/**"
      - "field_notes_audio/**"
      - ".github/workflows/validate-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"
      - "tools/graphics/**"
      - "tools/specimens/**"
      - "field_notes_audio/**"
      - ".github/workflows/validate-site.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install media inspection tools for published audio
        run: bash scripts/install_audit_media.sh
      - name: Verify generated editorial slots and archive behavior
        run: |
          python3 scripts/build_notes.py --check
          python3 scripts/wayfinding_output.test.py
          python3 scripts/reading_output.test.py
          node --test scripts/coastal_replay.test.mjs scripts/coastal_transport.test.mjs scripts/coastal_guide.test.mjs scripts/coastal_knowledge.test.mjs
          node --test scripts/shadow_inquiry.test.mjs
          node --test scripts/coastal_identity.test.mjs
          node --test scripts/coastal_haxr.test.mjs scripts/coastal_haxr_motion.test.mjs
          node --test scripts/field_power.test.mjs
          node --test scripts/maintenance_acceptance.test.mjs
          python3 scripts/maintenance/contracts_test.py
          python3 scripts/build_maintenance_tnt.py --check
          node --test scripts/maintenance_tnt.test.mjs
          node --test scripts/datacenter.test.mjs
          node --test scripts/finland_account.test.mjs
          node --test scripts/notes_model.test.mjs
          node --test scripts/field_listen_model.test.mjs
          node --test scripts/loose_end_model.test.mjs
          python3 tools/graphics/build_moth_model.py --check
          node --test scripts/moth_mesh.test.mjs
          node tools/specimens/build_connection_study.mjs --check
          node --test scripts/connection_study.test.mjs
      - name: Verify links, assets, accessibility hooks and sitemap
        run: python3 scripts/check_site.py
      - name: Syntax-check browser JavaScript
        run: |
          bash -n scripts/install_audit_browser.sh
          bash -n scripts/install_audit_media.sh
          node --check scripts/audit_wayfinding.mjs
          node --check docs/assets/maintenance-acceptance.mjs
          node --check docs/assets/maintenance-acceptance-model.mjs
          node --check docs/assets/maintenance-tnt.mjs
          node --check docs/assets/maintenance-tnt-model.mjs
          node --check docs/assets/maintenance-tnt-weave.mjs
          node --check scripts/audit_maintenance.mjs
          node --check docs/assets/datacenter.mjs
          node --check docs/assets/datacenter-finland.mjs
          node --check docs/assets/datacenter-households.mjs
          node --check docs/assets/datacenter-finland-model.mjs
          node --check scripts/audit_finland_account.mjs
          node --check docs/assets/datacenter-model.mjs
          node --check docs/assets/datacenter-room.mjs
          node --check scripts/audit_datacenter.mjs
          node --check docs/assets/field-power.mjs
          node --check docs/assets/field-power-model.mjs
          node --check docs/assets/field-power-scene.mjs
          node --check scripts/audit_field_power.mjs
          node --check docs/assets/coastal-replay.mjs
          node --check docs/assets/coastal-replay-model.mjs
          node --check scripts/audit_coastal_replay.mjs
          node --check scripts/audit_coastal_transport.mjs
          node --check docs/assets/coastal-transport.mjs
          node --check docs/assets/coastal-transport-model.mjs
          node --check docs/assets/coastal-guide.mjs
          node --check docs/assets/coastal-guide-model.mjs
          node --check docs/assets/coastal-knowledge.mjs
          node --check docs/assets/coastal-knowledge-model.mjs
          node --check docs/assets/shadow-inquiry.mjs
          node --check docs/assets/shadow-inquiry-model.mjs
          node --check scripts/audit_shadow_inquiry.mjs
          node --check docs/assets/coastal-identity.mjs
          node --check docs/assets/coastal-identity-model.mjs
          node --check scripts/audit_coastal_identity.mjs
          node --check docs/assets/coastal-haxr.mjs
          node --check docs/assets/coastal-haxr-model.mjs
          node --check docs/assets/coastal-haxr-history.mjs
          node --check docs/assets/coastal-haxr-returns.mjs
          node --check docs/assets/coastal-haxr-returns-view.mjs
          node --check docs/assets/coastal-haxr-motion.mjs
          node --check docs/assets/coastal-haxr-motion-view.mjs
          node --check docs/assets/coastal-haxr-candidates-view.mjs
          node --check scripts/audit_coastal_haxr.mjs
          node --check scripts/audit_coastal_guide.mjs
          node --check docs/assets/specimens.mjs
          node --check docs/assets/mapping-study.mjs
          node --check scripts/audit_mapping.mjs
          node --check scripts/audit_thread.mjs
          node --check scripts/audit_reading.mjs
          node --check scripts/audit_workbench_finish.mjs
          node --check docs/assets/connection-study.mjs
          node --check docs/assets/connection-study-model.mjs
          node --check scripts/audit_connection.mjs
          node --check docs/assets/moth-interlude.mjs
