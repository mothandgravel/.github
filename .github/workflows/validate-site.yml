name: Validate static site

on:
  push:
    paths:
      - "docs/**"
      - "scripts/check_site.py"
      - ".github/workflows/validate-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_site.py"
      - ".github/workflows/validate-site.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify links, assets, accessibility hooks and sitemap
        run: python3 scripts/check_site.py
      - name: Syntax-check browser JavaScript
        run: node --check docs/assets/site.js
