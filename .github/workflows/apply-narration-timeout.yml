name: Apply tested narration timeout fix

on:
  push:
    branches: [studio/durable-note-preparation]
    paths:
      - .github/narration-timeout.patch
      - .github/workflows/apply-narration-timeout.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/studio/durable-note-preparation' && github.event.head_commit.message == 'Stage tested narration timeout fix on branch baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact baseline and tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '84858cbbe6821ab4737f88fcb1f1b9cc14d4c892'
          test "$(git ls-remote origin refs/heads/studio/durable-note-preparation | cut -f1)" = "$GITHUB_SHA"
          echo '544f818e3840e32181b1524233f0a180fce1195c3170db952926ad599e2e1130  .github/narration-timeout.patch' | sha256sum --check
          git apply --check --index .github/narration-timeout.patch
          git apply --index .github/narration-timeout.patch
          git rm .github/narration-timeout.patch .github/workflows/apply-narration-timeout.yml
          # The source artifact was a PR merge preview with main 1c03eb0.
          # Preserve this branch's untouched docs/scripts/workflows instead of
          # copying concurrent main changes into this focused code patch.
          # Code, tests and guides are the exact locally tested blob identities.
          test "$(git write-tree)" = '34fb2b346f9a5a3678fa6bc3379569851f2e0030'
      - name: Keep pinned quality gates
        run: |
          python -m pip install ruff==0.12.12
          python -m ruff check
          python -m ruff format --check
          git diff --cached --check
      - name: Commit only to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/studio/durable-note-preparation | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Raise captured narration socket timeout without invalidating saved chunks'
          git push origin HEAD:refs/heads/studio/durable-note-preparation
