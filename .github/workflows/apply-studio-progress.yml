name: Apply tested Studio progress changes
on:
  push:
    branches: [studio/durable-note-preparation]
    paths: [.github/workflows/apply-studio-progress.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'mothandgravel/.github'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify baseline, patch bytes and exact tested result
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '4215cf66e40034fbecb8ab1ca5c60054c3110982'
          test "$(git ls-remote origin refs/heads/studio/durable-note-preparation | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/studio-progress.part{i}.b64').read_text().strip() for i in (1, 2))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4f8884dc9182ef6fa7974e8e45f6e3fb118e4ae64a2873924388c29c1fb9707c'
          Path('/tmp/studio-progress.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/studio-progress.patch
          git apply --index /tmp/studio-progress.patch
          git rm .github/studio-progress.part1.b64 .github/studio-progress.part2.b64 .github/workflows/apply-studio-progress.yml
          test "$(git write-tree)" = '260d9830f883cb76360c74f496e1062250ae67f3'
      - name: Keep pinned quality checks
        run: |
          python -m pip install ruff==0.12.12
          python -m ruff check
          python -m ruff format --check
          git diff --cached --check
      - name: Commit the verified result to this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/studio/durable-note-preparation | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make Studio progress actionable with named milestones and labelled tab icons'
          git push origin HEAD:refs/heads/studio/durable-note-preparation
