name: Capture Studio readiness baseline
on:
  push:
    branches: [studio/durable-note-preparation]
    paths: [.github/workflows/studio-readiness-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ffb0f7bd479f8bc26e2d98dfe15449b8d0e3873d
          persist-credentials: false
      - run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/studio-readiness-source.tar.gz"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip download --no-deps ruff==0.12.12 --dest "$RUNNER_TEMP/readiness-tools"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-readiness-source
          path: |
            ${{ runner.temp }}/studio-readiness-source.tar.gz
            ${{ runner.temp }}/readiness-tools/*.whl
          retention-days: 2
