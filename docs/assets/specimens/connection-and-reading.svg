    <rect width="264" height="248" fill="url(#paper)" stroke="#d6c6a6"/>
    <rect x="18" y="18" width="228" height="178" fill="#24282a"/>
    <g fill="none" stroke="#d9c49f"><path d="M34 48H129 M34 62H98 M34 152H68V120H95V138H121V93H148V114H176V77H202V104H230" stroke-width="2"/><path d="M34 170H230" stroke-opacity=".35"/></g>
    <g stroke="#655941" stroke-width="2"><path d="M22 220H118 M202 220H241"/></g>
    <circle cx="155" cy="220" r="4" fill="#907449"/>
  </g>
  <g fill="none" stroke="#c6b18c" stroke-opacity=".6"><path d="M89 362H419 M559 362H872"/><circle cx="89" cy="362" r="3"/><circle cx="872" cy="362" r="3"/></g>
