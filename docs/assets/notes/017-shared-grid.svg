<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
<title>The grid is shared — a connection drawn from home</title>
<desc>An authored schematic: a home, an electricity connection and a server hall above separate electricity and heat routes. This is an editorial illustration, not a surveyed network or measured heat attribution.</desc>
<defs>
 <linearGradient id="ground" x2="1" y2="1"><stop stop-color="#242827"/><stop offset="1" stop-color="#111719"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#c5ab75" stop-opacity=".14"/><stop offset="1" stop-color="#c5ab75" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#ebe5d3" stroke-opacity=".035"/></pattern>
 <pattern id="fins" width="15" height="16" patternUnits="userSpaceOnUse"><path d="M0 4h10M0 8h10M0 12h10" stroke="#b8b5a8" stroke-opacity=".25"/></pattern>
</defs>
<path fill="url(#ground)" d="M0 0h1600v1000H0z"/><path fill="url(#grid)" d="M0 0h1600v1000H0z"/>
<ellipse cx="350" cy="590" rx="470" ry="390" fill="url(#light)"/>
