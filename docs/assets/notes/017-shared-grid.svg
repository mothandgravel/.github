<text x="80" y="255" fill="#eee7d5" font-family="Georgia,serif" font-size="94" letter-spacing="-3">The grid is shared.</text>
<text x="84" y="300" fill="#b5b4a7" font-family="monospace" font-size="18" letter-spacing="1">A BILL. A CONNECTION. HEAT AT HOME.</text>
<g stroke="#ddd3bb" stroke-width="2" stroke-linejoin="round">
