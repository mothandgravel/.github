<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Grouping changes the destination at each blend</title>
<desc id="desc">Sequential drawing blends three packets onto the scene with rounding after each draw. Grouped drawing blends three packets onto a transparent target with rounding after each draw, then composites that group onto the scene with another rounding step.</desc>
<rect width="1200" height="650" fill="#17191b"/>
<text x="64" y="75" fill="#eee7d5" font-family="Georgia,serif" font-size="34">The destination matters before the last blend.</text>
<g font-family="Arial,sans-serif" font-size="18" fill="#d4b584"><text x="64" y="132">SEQUENTIAL / SCENE IS PRESENT THROUGHOUT</text><text x="64" y="346">GROUPED / TRANSPARENT TARGET FIRST</text></g>
<g fill="#24282a" stroke="#747268"><rect x="64" y="165" width="190" height="110" rx="6"/><rect x="310" y="165" width="190" height="110" rx="6"/><rect x="556" y="165" width="190" height="110" rx="6"/><rect x="802" y="165" width="334" height="110" rx="6"/><rect x="64" y="379" width="190" height="110" rx="6"/><rect x="310" y="379" width="190" height="110" rx="6"/><rect x="556" y="379" width="190" height="110" rx="6"/><rect x="802" y="379" width="334" height="110" rx="6"/></g>
<g stroke="#d4b584" stroke-width="3" fill="none"><path d="M266 220h30m-9-8 9 8-9 8M512 220h30m-9-8 9 8-9 8M758 220h30m-9-8 9 8-9 8M266 434h30m-9-8 9 8-9 8M512 434h30m-9-8 9 8-9 8M758 434h30m-9-8 9 8-9 8"/></g>
<g font-family="Georgia,serif" fill="#eee7d5" font-size="24"><text x="90" y="210">Draw 1</text><text x="336" y="210">Draw 2</text><text x="582" y="210">Draw 3</text><text x="835" y="230">Scene result</text><text x="90" y="424">Draw 1</text><text x="336" y="424">Draw 2</text><text x="582" y="424">Draw 3</text><text x="832" y="424">Group over scene</text></g>
<g font-family="Arial,sans-serif" font-size="18" fill="#b5b3aa"><text x="90" y="249">round</text><text x="336" y="249">round</text><text x="582" y="249">round</text><text x="90" y="463">round</text><text x="336" y="463">round</text><text x="582" y="463">round</text><text x="832" y="463">round</text><text x="64" y="551">Chosen native control: pure green matches; RGB 37,113,197 differs by at most one channel level.</text><text x="64" y="590">Conceptual blend sequence, not measured colour swatches or an explanation for larger scene errors.</text></g>
</svg>
